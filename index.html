<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rahul Mittal</title>
<meta name="description" content="The personal website of Rahul Mittal. Profile and CV.">
<link rel="canonical" href="https://rahulmittal.org/">
<meta property="og:title" content="Rahul Mittal">
<meta property="og:description" content="Profile and CV.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rahulmittal.org/">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="site.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; }
  h1 { margin: 0; font: inherit; }
  .content { flex: 1; padding: 1.25rem; background: var(--panel); border-bottom: 1px solid var(--border); }
  .content p { margin: 0 0 1rem; }
</style>
<script>
  // F6.4: apply the saved size before the page is drawn.
  var SIZES = [87.5, 100, 112.5, 125, 150], size = 100;
  try { var s = parseFloat(localStorage.getItem("fontSize")); if (SIZES.indexOf(s) >= 0) size = s; } catch (e) {}
  document.documentElement.style.fontSize = size + "%";
</script>
</head>
<body>
<nav class="site" aria-label="Main">
  <div class="site-head">
    <a class="brand" href="./">Rahul Mittal</a>
    <div class="sizes" id="sizes" role="group" aria-label="Font size" hidden>
      <button type="button" id="smaller" aria-label="Decrease font size">A−</button><button type="button" id="reset" aria-label="Reset font size">A</button><button type="button" id="larger" aria-label="Increase font size">A+</button>
    </div>
    <span id="status" class="sr-only" role="status"></span>
  </div>
  <ul class="tabs">
    <li><a href="./" aria-current="page">Home</a></li>
    <li><a href="cv/">CV</a></li>
    <li><a href="https://interviewpedia.rahulmittal.org/">Interviewpedia</a></li>
  </ul>
</nav>
<main class="site">
  <div class="panel-head"><h1>Welcome</h1></div>
  <div class="content">
    <p>Welcome to my personal website.</p>
    <p><a class="btn" href="cv/">View my CV</a></p>
    <p>My profile is coming soon.</p>
  </div>
</main>
<div class="site foot">Curated by: <a href="https://in.linkedin.com/in/rahulmitt">Rahul Mittal</a></div>
<script>
  function el(id) { return document.getElementById(id); }
  function buttons() {
    el("smaller").disabled = size === SIZES[0];
    el("larger").disabled = size === SIZES[SIZES.length - 1];
  }
  function setSize(v) {
    size = v;
    document.documentElement.style.fontSize = size + "%";
    try { localStorage.setItem("fontSize", size); } catch (e) {}
    buttons();
    el("status").textContent = "Font size " + size + "%";
  }
  function step(d) {
    var v = SIZES[SIZES.indexOf(size) + d];
    if (v) setSize(v);
  }
  el("smaller").onclick = function () { step(-1); };
  el("larger").onclick = function () { step(1); };
  el("reset").onclick = function () { setSize(100); };
  buttons();
  el("sizes").hidden = false;
</script>
</body>
</html>
