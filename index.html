<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rahul Mittal</title>
<meta name="description" content="The personal website of Rahul Mittal: CV, Interviewpedia and Spec-Driven Development.">
<link rel="canonical" href="https://rahulmittal.org/">
<meta property="og:title" content="Rahul Mittal">
<meta property="og:description" content="CV, Interviewpedia and Spec-Driven Development.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rahulmittal.org/">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="site.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; }
  h1 { margin: 0; line-height: 1.5; }
  .links { flex: 1; margin: 0; padding: 1.25rem 1.25rem 1.25rem 2.5rem; background: var(--panel); border-top: 1px solid var(--border); }
  .links li { margin-bottom: 1rem; }
</style>
<script>
  // F6.4: apply the saved size before the page is drawn.
  var SIZES = [62.5, 75, 87.5, 100, 112.5, 125, 150], size = 100;
  try { var s = parseFloat(localStorage.getItem("fontSize")); if (SIZES.indexOf(s) >= 0) size = s; } catch (e) {}
  document.documentElement.style.fontSize = size + "%";
</script>
</head>
<body>
<header class="site site-head">
  <h1 class="brand">Rahul Mittal</h1>
  <div class="sizes" id="sizes" role="group" aria-label="Font size" hidden>
    <button type="button" id="smaller" aria-label="Decrease font size">A−</button><button type="button" id="reset" aria-label="Reset font size">A</button><button type="button" id="larger" aria-label="Increase font size">A+</button>
  </div>
  <span id="status" class="sr-only" role="status"></span>
</header>
<main class="site">
  <ol class="links">
    <li><a class="btn" target="_blank" rel="noopener" href="cv/">CV<span class="sr-only"> (opens in a new tab)</span></a></li>
    <li><a class="btn" target="_blank" rel="noopener" href="https://interviewpedia.rahulmittal.org/">Interviewpedia<span class="sr-only"> (opens in a new tab)</span></a></li>
    <li><a class="btn" target="_blank" rel="noopener" href="https://github.com/rahulmitt/spec-driven-development">Spec-Driven Development<span class="sr-only"> (opens in a new tab)</span></a></li>
  </ol>
</main>
<script>
  function el(id) { return document.getElementById(id); }
  function buttons() {
    el("smaller").disabled = size === SIZES[0];
    el("larger").disabled = size === SIZES[SIZES.length - 1];
  }
  function setSize(v) {
    size = v;
    document.documentElement.style.fontSize = size + "%";
    try { localStorage.setItem("fontSize", size); } catch (e) {}
    buttons();
    el("status").textContent = "Font size " + size + "%";
  }
  function step(d) {
    var v = SIZES[SIZES.indexOf(size) + d];
    if (v) setSize(v);
  }
  el("smaller").onclick = function () { step(-1); };
  el("larger").onclick = function () { step(1); };
  el("reset").onclick = function () { setSize(100); };
  buttons();
  el("sizes").hidden = false;
</script>
</body>
</html>
